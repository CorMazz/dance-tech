metadata:
  test_name: "Standard Follower Test"
  config_settings:
    live_grading: true
    show_point_values: true
  minimum_percent: 0.60
  max_score: 101

tables:
  - sections:
    - name: "Follower Pattern Scoring"
      scoring_categories:
        - name: "Footwork"
          values: ["Perfect", "Right Concept", "Nope"]
        - name: "Timing"
          values: ["On", "Off"]
        - name: "Shaping"
          values: ["Shaped", "Flat"]
      competencies:
        - name: "Left Side Pass"
          scores: 
            - [2, 1, 0]
            - [1, 0]
            - [1, 0]
          failing_score_labels:
            - scoring_category_name: "Footwork"
              values: ["Nope"]
        - name: "Right Side Pass"
          scores:
            - [2, 1, 0]
            - [1, 0]
            - [1, 0]
          failing_score_labels:
            - scoring_category_name: "Footwork"
              values: ["Nope"]
        - name: "Whip"
          scores:
            - [2, 1, 0]
            - [1, 0]
            - [1, 0]
          failing_score_labels:
            - scoring_category_name: "Footwork"
              values: ["Nope"]
        - name: "Spinning Side Pass"
          scores:
            - [2, 1, 0]
            - [1, 0]
            - [1, 0]
          failing_score_labels:
            - scoring_category_name: "Footwork"
              values: ["Nope"]
        - name: "Sugar Push"
          scores:
            - [2, 1, 0]
            - [1, 0]
            - [1, 0]
          failing_score_labels:
            - scoring_category_name: "Footwork"
              values: ["Nope"]

  - sections:
    - name: "Technique Scoring"
      scoring_categories:
        - name: ""
          values: ["Consistent >90%", "Present 75%", "Occasional 50%", "Lacking 25%", "Missing <10%"]
      competencies:
        - name: "Strong Frame"
          subtext: "(Week 2)"
          scores: 
            - [8, 5, 0, 0, 0]
          failing_score_labels: 
            - scoring_category_name: ""
              values: ["Missing <10%", "Lacking 25%", "Occasional 50%"]
          antithesis: "Weak Frame"
        - name: "Post"
          subtext: "(Week 2)"
          scores:
            - [6, 4, 2, 0, 0]
          failing_score_labels: 
            - scoring_category_name: ""
              values: ["Missing <10%", "Lacking 25%", "Occasional 50%"]
          antithesis: "Floating Anchor"
        - name: "Anchor in 3rd Position"
          subtext: "(Week 2)"
          scores:
            - [8, 0, 0, 0, 0]
          failing_score_labels: 
            - scoring_category_name: ""
              values: ["Missing <10%", "Lacking 25%", "Occasional 50%"]
          antithesis: "Rock Step"
        - name: "Stretch"
          subtext: "(Week 1/2)"
          scores:
            - [6, 4, 2, 0, 0]
          failing_score_labels: 
            - scoring_category_name: ""
              values: ["Missing <10%", "Lacking 25%", "Occasional 50%"]
          antithesis: "Over Eager"
        - name: "Variable Speed"
          subtext: "(Week 1)"
          scores:
            - [4, 3, 2, 1, 0]
          antithesis: "Monotonous"
        - name: "Connection Transition"
          subtext: "(Week 2 - Dimmer Switch)"
          scores:
            - [8, 5, 0, 0, 0]
          failing_score_labels: 
            - scoring_category_name: ""
              values: ["Missing <10%", "Lacking 25%", "Occasional 50%"]
          antithesis: "Brick Wall (Toggle Switch)"
        - name: "Connection Hierarchy"
          subtext: "(Week 4)"
          scores:
            - [6, 4, 2, 0, 0]
          failing_score_labels: 
            - scoring_category_name: ""
              values: ["Missing <10%", "Lacking 25%", "Occasional 50%"]
          antithesis: "Panic"
        - name: "Directionality"
          subtext: "(Week 1/3)"
          scores:
            - [6, 4, 0, 0, 0]
          failing_score_labels: 
            - scoring_category_name: ""
              values: ["Missing <10%", "Lacking 25%", "Occasional 50%"]
          antithesis: "Directionless"
        - name: "Kissing Connection"
          subtext: "(Week 3)"
          scores:
            - [6, 4, 2, 0, 0]
          failing_score_labels: 
            - scoring_category_name: ""
              values: ["Missing <10%", "Lacking 25%", "Occasional 50%"]
          antithesis: "Disconnected"
        - name: "Spins"
          subtext: "(Week 3)"
          scores:
            - [4, 3, 0, 0, 0]
          failing_score_labels: 
            - scoring_category_name: ""
              values: ["Missing <10%", "Lacking 25%", "Occasional 50%"]
          antithesis: "Unbalanced"
        - name: "Personal Safety"
          subtext: ""
          scores:
            - [8, 5, 0, 0, 0]
          failing_score_labels: 
            - scoring_category_name: ""
              values: ["Missing <10%", "Lacking 25%", "Occasional 50%", "Present 75%"]
          antithesis: "Masochist"
        - name: "Partner Safety"
          subtext: ""
          scores:
            - [8, 0, 0, 0, 0]
          failing_score_labels: 
            - scoring_category_name: ""
              values: ["Missing <10%", "Lacking 25%", "Occasional 50%", "Present 75%"]
          antithesis: "Abusive"

    - name: ""
      scoring_categories:
        - name: ""
          values: ["Perpendicular", "Over-Angled", "Angled", "Under-Angled", "Flat"]
      competencies:
        - name: "Body Angle"
          subtext: "(Week 2)"
          scores:
            - [0, 2, 3, 2, 0]
          failing_score_labels:
            - scoring_category_name: ""
              values: ["Perpendicular", "Flat"]

bonus_items: 
  - name: "No Biceps"
    score: 1
  - name: "Spotting"
    score: 1
  - name: "Connection in Motion"
    score: 2
  - name: "Swung Triple"
    score: 4

