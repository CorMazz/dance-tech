[package]
name = "dancetech"
version = "1.0.0"
edition = "2024"
license = "Private"
description = "A web application for managing dance events, users, and registrations."
repository = "https://github.com/CorMazz/dance-tech"
authors = ["Corrado Mazzarelli"]
keywords = ["web", "dance", "events",]
categories = ["Web Application"]


[dependencies]
argon2 = "0.5.3"
askama = {version = "0.14.0", features = ["blocks", "serde_json"]}
axum = "0.8.9"
axum-extra = { version = "0.10.3", features = ["cookie", "query"] }
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10"
csv = "1.4.0"
dotenv = "0.15.0"
glob = "0.3.4"
jsonwebtoken = "9.3.1"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "pool", "tokio1", "tokio1-rustls-tls", "builder", ] }
oauth2 = "5.0.0"
rand = "0.9.5"
rand_core = { version = "0.9.5"}
redis = { version = "0.32.7", features = ["aio", "tokio-comp"] }
reqwest = { version = "0.12.28", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sqlx = { version = "0.8.6", features = ["chrono", "postgres", "runtime-tokio", "uuid"] }
strum = "0.27.2"
strum_macros = "0.27.2"
thiserror = "2.0.20"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.6.11", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
