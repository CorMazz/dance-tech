[package]
name = "dancetech"
version = "1.0.0"
edition = "2024"
license = "Private"
description = "A web application for managing dance events, users, and registrations."
repository = "https://github.com/CorMazz/dance-tech"
authors = ["Corrado Mazzarelli"]
keywords = ["web", "dance", "events",]
categories = ["Web Application"]


[dependencies]
argon2 = "0.5.3"
askama = {version = "0.14.0", features = ["blocks", "serde_json"]}
axum = "0.8.4"
axum-extra = { version = "0.10.1", features = ["cookie", "query"] }
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
csv = "1.3.1"
dotenv = "0.15.0"
glob = "0.3.2"
jsonwebtoken = "9.3.1"
lettre = { version = "0.11.17", default-features = false, features = ["smtp-transport", "pool", "tokio1", "tokio1-rustls-tls", "builder", ] }
oauth2 = "5.0.0"
rand_core = { version = "0.9.3"}
redis = { version = "0.32.0", features = ["aio", "tokio-comp"] }
reqwest = { version = "0.12.19", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
sqlx = { version = "0.8.6", features = ["chrono", "postgres", "runtime-tokio", "uuid"] }
strum = "0.27.1"
strum_macros = "0.27.1"
thiserror = "2.0.12"
time = "0.3.41"
tokio = { version = "1.45.1", features = ["full"] }
tower-http = { version = "0.6.6", features = ["cors", "fs", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
url = "2.5.4"
uuid = { version = "1.17.0", features = ["serde", "v4"] }
