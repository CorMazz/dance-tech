# This workflow builds the application and publishes it to the GitHub Container Registry
#
name: "CI Docker Build and Publish"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env: 
      TAG: "ghcr.io/cormazz/dance-tech:latest"

    steps:
      # https://github.com/actions/checkout
      - name: Checkout repo
        uses: actions/checkout@v5

      # https://github.com/docker/login-action?tab=readme-ov-file#github-container-registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # https://github.com/actions/cache/blob/main/examples.md#rust---cargo
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

        # https://docs.docker.com/build/cache/backends/gha/#using-dockerbuild-push-action
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
