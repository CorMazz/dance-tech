services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: "devenv"
    env_file:
      - ../.env_prod
    volumes:
      - ../:/workspaces:cached
      - ${HOME}/.config/nvim:/root/.config/nvim:rw  # If using neovim, uncomment these three lines
      - ${HOME}/.local/share/nvim:/root/.local/share/nvim:rw
      - ${HOME}/.cache/nvim:/root/.cache/nvim:rw
      - cargo-home:/usr/local/cargo:rw  # Caches your cargo crate downloads
    command: sleep infinity
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:14.1
    restart: unless-stopped
    ports:
      - "6500:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file:
      - ../.env_prod

  pgAdmin:
    image: dpage/pgadmin4
    env_file:
      - ../.env_prod
    ports:
      - "5050:80"
    depends_on:
      - postgres

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
  cargo-home:
