{% extends "../extensible_templates/nav_on_top.html" %}

{% block title %}Home{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50">
    <div class="max-w-sm w-full bg-white shadow-lg rounded-lg p-6">
        <!-- Error Icon -->
        <div class="flex justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v6m0 4v.01M12 3v.01M12 21v.01M5 12a7 7 0 1114 0A7 7 0 015 12z"/>
            </svg>
        </div>

        <!-- Error Message -->
        <h2 class="text-2xl font-semibold text-center text-gray-800 mt-4">Oops! Something went wrong.</h2>

        <p class="text-center text-gray-600 mt-2">We couldn't process your request. Please try again later, or contact support if the issue persists.</p>

        <div class="mt-6 text-center">
            <a href="/" class="inline-block bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Go Back Home</a>
        </div>
    </div>
</div>
{% endblock %}
