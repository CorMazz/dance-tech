{% match user %}

{% when Some with (data) %}

    <div class="flex items-center md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
        <button type="button" class="flex text-sm bg-gray-800 rounded-full md:me-0 focus:ring-4 focus:ring-gray-300 dark:focus:ring-gray-600" id="user-menu-button" aria-expanded="false" data-dropdown-toggle="user-dropdown" data-dropdown-placement="bottom">
            <span class="sr-only">Open user menu</span>
            <img class="w-8 h-8 rounded-full" src="/docs/images/people/profile-picture-3.jpg" alt="user photo">
        </button>

        <!-- Dropdown menu -->
        
        <div class="z-50 hidden my-4 text-base list-none bg-white divide-y divide-gray-100 rounded-lg shadow-sm dark:bg-gray-700 dark:divide-gray-600" id="user-dropdown">
        <div class="px-4 py-3">
            <span class="block text-sm text-gray-900 dark:text-white">{{ data.first_name }} {{ data.last_name }}</span>
            <span class="block text-sm  text-gray-500 truncate dark:text-gray-400">{{ data.email }}</span>
        </div>
        <ul class="py-2" aria-labelledby="user-menu-button">
            <li>
        <a href={{ rts.root }} hx-boost="true" hx-target="#primary-content" hx-swap="innerHTML" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 dark:hover:bg-gray-600 dark:text-gray-200 dark:hover:text-white">Home</a>
            </li>
        </ul>
        <div class="py-2">
          <a href={{rts.logout}} class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 dark:hover:bg-gray-600 dark:text-gray-200 dark:hover:text-white">Logout</a>
        </div>
        </div>
    </div>

{% when None %}
    <div class="flex items-center">
            <a href={{ rts.login }} hx-boost="true" hx-target="#primary-content" hx-swap="innerHTML">

            <!-- For really tiny screens, just say login so that it fits in the navbar -->
            <button type="button" class="sm:hidden text-white bg-secondary-400 hover:bg-secondary-500 focus:ring-4 focus:outline-none focus:ring-secondary-400 font-medium rounded-lg text-sm px-4 py-2 text-center">Login</button>
            
            <!-- Otherwise say sign in/sign up  -->
            <button type="button" class="hidden sm:block text-white bg-secondary-400 hover:bg-secondary-500 focus:ring-4 focus:outline-none focus:ring-secondary-400 font-medium rounded-lg text-sm px-4 py-2 text-center">Sign In/Sign Up</button>
        </a>    
    </div>

{% endmatch %}
