{% match user %}

  {% when Some with (data) %}

    <div class="flex items-center md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
      <!-- User avatar button -->
      <button type="button" 
              class="flex text-sm bg-primary-300 rounded-full focus:ring-4 focus:ring-primary-200" 
              id="user-menu-button" 
              aria-expanded="false" 
              data-dropdown-toggle="user-dropdown" 
              data-dropdown-placement="bottom">
        <span class="sr-only">Open user menu</span>
        <img class="w-8 h-8 rounded-full border border-edge" src="{{ pfp_url }}" alt="user photo">
      </button>

      {# Dropdown Menu #}
      <div id="user-dropdown" 
           class="z-50 hidden my-4 text-base list-none bg-card border border-edge rounded-xl shadow-lg animate-fade-in-opacity">
        
        <!-- User info -->
        <div class="px-4 py-3">
          <span class="block text-sm font-semibold text-ink">
            {{ data.first_name }} {{ data.last_name }}
          </span>
          <span class="block text-sm text-muted truncate">
            {{ data.email }}
          </span>
        </div>

        <!-- Links -->
        <ul class="py-2" aria-labelledby="user-menu-button">
          <li>
            <a href={{ rts.root }} hx-boost="true" hx-target="#primary-content" hx-swap="innerHTML"
               class="block px-4 py-2 text-sm text-ink hover:bg-surface transition">
              Home
            </a>
          </li>
          {% if is_proctor %}
          <li>
            <a href={{ rts.proctor_dashboard }} hx-boost="true" hx-target="#primary-content" hx-swap="innerHTML"
               class="block px-4 py-2 text-sm text-ink hover:bg-surface transition">
              Proctor Dashboard
            </a>
          </li>
          {% endif %}
          {% if is_admin %}
          <li>
            <a href={{ rts.admin_dashboard }} hx-boost="true" hx-target="#primary-content" hx-swap="innerHTML show:none"
               class="block px-4 py-2 text-sm text-ink hover:bg-surface transition">
              Admin Dashboard
            </a>
          </li>
          {% endif %}
        </ul>

        <!-- Logout -->
        <div class="py-2 border-t border-edge">
          <a href={{ rts.logout }} 
             class="block px-4 py-2 text-sm text-ink hover:bg-surface transition">
            Logout
          </a>
        </div>
      </div>
    </div>

    {% when None %}
    <div class="flex items-center">
      <a href={{ rts.login }} hx-boost="true" hx-target="#primary-content" hx-swap="innerHTML show:none">
        <!-- Tiny screens -->
        <button type="button" class="sm:hidden my-nav-cta">
          Login
        </button>
        <!-- Larger screens -->
        <button type="button" class="hidden sm:inline-flex my-nav-cta">
          Sign In
        </button>
      </a>
    </div>

{% endmatch %}
