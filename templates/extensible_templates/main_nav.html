{% extends "base.html" %}

{% block primary_navbar %}

  <nav class="my-navbar">
    <div class="max-w-screen-xl mx-auto px-4 sm:px-6 h-14 flex items-center gap-3">

      <a href="/" class="flex items-center gap-2 shrink-0">
          <img src="/static/images/dance_tech_logo.png" class="h-8 rounded" alt="DanceTech logo" />
          <span class="text-base font-semibold tracking-tight text-ink">DanceTech</span>
      </a>

      <div class="hidden md:flex items-center gap-6 ml-4">
        <a href={{ rts.root }} hx-boost="true" hx-target="#primary-content" hx-swap="innerHTML show:none" class="my-nav-button">Home</a>
        <a href={{ rts.check_in }} hx-boost="true" hx-target="#primary-content" hx-swap="innerHTML show:none" class="my-nav-button">Check In</a>
        <a href={{ rts.user_dashboard }} hx-boost="true" hx-target="#primary-content" hx-swap="innerHTML show:none" class="my-nav-button">Exam</a>
        <a href={{ rts.contact }} hx-boost="true" hx-target="#primary-content" hx-swap="innerHTML show:none" class="my-nav-button">Contact</a>
        <span id="staff-nav-desktop" class="flex items-center gap-6"></span>
      </div>

      <div class="ml-auto flex items-center gap-1">
        <button type="button" class="my-theme-toggle" onclick="window.__toggleTheme()" aria-label="Toggle color theme">
          <svg class="theme-icon-moon size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          <svg class="theme-icon-sun size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path stroke-linecap="round" d="M12 2v2m0 16v2m10-10h-2M4 12H2m15.66-6.66-1.42 1.42M7.76 16.24l-1.42 1.42m12.08 0-1.42-1.42M7.76 7.76 6.34 6.34" />
          </svg>
        </button>

        <div class="flex items-center" hx-get={{ rts.user_dropdown }} hx-trigger="load"></div>

        <details id="mobile-nav" class="my-nav-menu relative md:hidden">
          <summary aria-label="Open menu">
            <svg class="size-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15"/>
            </svg>
          </summary>
          <div class="absolute right-0 top-full mt-2 w-56 rounded-xl border border-edge bg-card p-2 shadow-lg z-50">
            <a href={{ rts.root }} hx-boost="true" hx-target="#primary-content" hx-swap="innerHTML show:none" class="my-nav-button">Home</a>
            <a href={{ rts.check_in }} hx-boost="true" hx-target="#primary-content" hx-swap="innerHTML show:none" class="my-nav-button">Check In</a>
            <a href={{ rts.user_dashboard }} hx-boost="true" hx-target="#primary-content" hx-swap="innerHTML show:none" class="my-nav-button">Exam</a>
            <a href={{ rts.contact }} hx-boost="true" hx-target="#primary-content" hx-swap="innerHTML show:none" class="my-nav-button">Contact</a>
            <div id="staff-nav-mobile"></div>
          </div>
        </details>
      </div>

    </div>
  </nav>

{% endblock %}
