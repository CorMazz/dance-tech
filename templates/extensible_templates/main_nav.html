{% extends "base.html" %}

{% block primary_navbar %}

  <nav class="my-navbar">
    <div class="max-w-screen-xl mx-auto px-3 md:px-6 py-3 flex items-center justify-between flex-wrap">

      {# Logo #}

      <a href="/" class="flex items-center space-x-3 rtl:space-x-reverse">
          <img src="/static/images/dance_tech_logo.png" class="h-8 rounded" alt="Dance Tech Logo" />
          <span class="self-center text-2xl font-bold tracking-tight whitespace-nowrap">DanceTech</span>
      </a>

      <div class="flex md:order-last">
        {# Sign-In/Up Button or User Dropdown #}

        <div class="flex items-center space-x-3 md:space-x-0 mr-2" hx-get={{ rts.user_dropdown }} hx-trigger="load"></div>

        {# Hamburger Button (for mobile/small screens) #}

        {% let navbar_id = "navbar-user" %}

        <button data-collapse-toggle={{ navbar_id }} type="button" class="inline-flex items-center p-2 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden mx-auto hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200" aria-controls={{ navbar_id }} aria-expanded="false">
          <span class="sr-only">Open main menu</span>
          <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15"/>
          </svg>
        </button>
      </div>

      {# Navigation Links #}

      <div class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1" id={{ navbar_id }}>
        <ul class="flex flex-col font-medium p-4 md:p-0 mt-4 sm:border sm:border-gray-100 rounded-lg sm:bg-gray-50 md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0 md:bg-transparent animate-fade-in-opacity">
          <li class="rounded hover:bg-primary-300/40 md:hover:bg-transparent transition duration-400 ease-in-out">
            <a href={{ rts.root }} hx-boost="true" hx-target="#primary-content" hx-swap="innerHTML show:none" class="my-nav-button">Home</a>
          </li>
          <li class="rounded hover:bg-primary-300/40 md:hover:bg-transparent transition duration-400 ease-in-out">
            <a href={{ rts.check_in }} hx-boost="true" hx-target="#primary-content" hx-swap="innerHTML show:none" class="my-nav-button">Check In</a>
          </li>
          <li class="rounded hover:bg-primary-300/40 md:hover:bg-transparent transition duration-400 ease-in-out">
            <a href={{ rts.user_dashboard }} hx-boost="true" hx-target="#primary-content" hx-swap="innerHTML show:none" class="my-nav-button">Advancement Exam</a>
          </li>
          <li class="rounded hover:bg-primary-300/40 md:hover:bg-transparent transition duration-400 ease-in-out">
            <a href={{ rts.contact }} hx-boost="true" hx-target="#primary-content" hx-swap="innerHTML show:none" class="my-nav-button">Contact</a>
          </li>
        </ul>
      </div>

    </div>
  </nav>

  <script>
    window.addEventListener("load", () => {
      const button = document.querySelector("[data-collapse-toggle='{{ navbar_id }}']");
      const menu = document.getElementById("{{ navbar_id }}");

      if (!button || !menu) {
        console.warn("Navbar button or menu not found");
        return;
      }

      {#
        Flowbite sometimes creates multiple Collapse instances for the same
        target element (especially with responsive breakpoints). Instead of
        picking one, we operate on **all instances that point to the same
        trigger button**. This ensures outside-click and Escape handling
        works consistently, no matter how many internal instances exist.
      #}

      function getAllCollapsesForButton() {
        const instancesObj = FlowbiteInstances.getInstances("Collapse");
        if (!instancesObj) return [];

        // Convert object values to array
        const instances = Object.values(instancesObj);

        // Return only those with our trigger button
        return instances.filter(c => c._triggerEl === button);
      }

      // Close on outside click
      document.addEventListener("click", (e) => {
        const userDropdown = document.querySelector("[data-collapse-toggle='user-dropdown']");
        const isOpen = !menu.classList.contains("hidden");

        if (
          isOpen &&
          !menu.contains(e.target) &&
          !button.contains(e.target) &&
          !(userDropdown && userDropdown.contains(e.target))
        ) {
          const collapses = getAllCollapsesForButton();
          collapses.forEach(c => c.collapse()); // collapse all linked instances
        }
      });

      // Close on Escape key
      document.addEventListener("keydown", (e) => {
        const isOpen = !menu.classList.contains("hidden");
        if (e.key === "Escape" && isOpen) {
          const collapses = getAllCollapsesForButton();
          collapses.forEach(c => c.collapse());
        }
      });
    });
  </script>

{% endblock %}
