{% extends "../extensible_templates/main_nav.html" %}

{% block title %}Proctor Dashboard{% endblock %}

{% block content %}

  <div class="my-section">
    <h1 class="py-4 text-3xl font-bold text-gray-800">Test Administration</h1>

    <div class="my-flexbox">
      {% for test_name in test_names %}
        <a 
          href={{ rts.administer_exam(loop.index0) }} 
          hx-boost="true" hx-target="#primary-content" hx-swap="innerHTML show:none"
          class="my-card w-full max-w-sm"
        >
          <h5 class="my-title">{{ test_name }}</h5>
          <p class="my-paragraph">Administer this test.</p>
        </a>
      {% endfor %}
    </div>
  </div>

  <div hx-get={{ rts.queue_widget }} hx-trigger="load"></div>

  <div id="search-tests-container" hx-get="{{ rts.search_exam_widget }}" hx-trigger="load"></div>

{% endblock %}
