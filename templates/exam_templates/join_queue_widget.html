
<div class="my-section my-dashboard-gradient">
  <div class="my-section-header">
    <h1 class="my-section-title">Join the Queue</h1>
  </div>

  {% if is_signed_in %}
    <div class="my-grid">
      {% for test_name in test_names %}
        <button
          hx-post={{ rts.queue_query("self", loop.index0) }}
          hx-swap="none"
          hx-push-url="false"
          hx-on::after-request="document.querySelector('#{{ ids.queue_reload_handler }}')?.dispatchEvent(new CustomEvent('{{ ids.refresh_queue_event }}', { bubbles: true }))"
          class="my-card"
        >
          <h5 class="my-title">{{ test_name }}</h5>
        </button>
      {% endfor %}
    </div>
  {% else %}
   <p class="my-fineprint">Sign in to join the test queue.</p>
  {% endif %}
</div>
