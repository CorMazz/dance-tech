
<div class="my-section">
  <h1 class="my-title">Join the Queue</h1>

  <div class="my-flexbox">
    {% if is_signed_in %}
      {% for test_name in test_names %}
        <button
          hx-post={{ rts.queue_query("self", loop.index0) }}
          hx-swap="none"
          hx-push-url="false"
          hx-on::after-request="document.querySelector('#{{ ids.queue_container }}')?.dispatchEvent(new CustomEvent('{{ ids.refresh_queue_event }}', { bubbles: true }))"
          class="my-card"
        >
          <h5 class="my-title">{{ test_name }}</h5>
          <p class="my-paragraph">Take this test.</p>
        </button>
      {% endfor %}
    {% else %}
     <p class="my-fineprint text-left">Sign in to join the test queue.</p>
    {% endif %}
  </div>
</div>
