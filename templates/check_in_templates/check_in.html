
{% extends "../extensible_templates/main_nav.html" %}

{% block title %}Check In{% endblock %}

{% block content %}
<div class="container mx-auto p-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        {% for product in products %}
        <div class="my-card">
            <div class="p-6">
                <h2 class="my-title">{{ product.name }}</h2>
                <p class="my-paragraph mb-2">{{ product.description }}</p>
                <form action={{ rts.create_checkout_session }} method="POST">
                    <input type="hidden" name="product_id" value="{{ product.id }}">
                    <input type="hidden" name="price_id" value="{{ product.price_id }}">
                    <button type="submit" class="my-button">
                        Checkout - {{ product.price }}
                    </button>
                </form>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
