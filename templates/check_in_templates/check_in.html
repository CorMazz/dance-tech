
{% extends "../extensible_templates/main_nav.html" %}

{% block title %}Check In{% endblock %}

{% block content %}
<div class="container mx-auto p-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        {% for product in products %}
        <div class="bg-white shadow-md rounded-lg overflow-hidden hover:bg-gray-50 hover:shadow-xl transition duration-300">
            <div class="p-6">
                <h2 class="text-2xl font-semibold text-gray-800 mb-2">{{ product.name }}</h2>
                <p class="text-gray-600 mb-4">{{ product.description }}</p>
                <form action="/create-checkout-session/{{ product.id }}/{{ product.price_id }}" method="POST">
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
                        Checkout - {{ product.price }} 
                    </button>
                </form>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
